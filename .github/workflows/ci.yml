name: TaskFlow CI

# Запускать этот скрипт при каждом push в ветку main (или master)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # Поднимаем виртуальную машину на Linux

    steps:
      # 1. Скачиваем твой код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java 21 на виртуальную машину
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Кэшируем зависимости, чтобы сборка шла быстрее

      # 3. Запускаем компиляцию и прогоняем все тесты!
      - name: Build and Test with Maven
        run: mvn -B clean package