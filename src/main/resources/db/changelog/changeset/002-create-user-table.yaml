databaseChangeLog:
  - changeSet:
      id: 002-create-user-table
      author: arman
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-add-assignee-to-task
      author: arman
      changes:
        - addColumn:
            tableName: task
            columns:
              - column:
                  name: assignee_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_task_assignee
                    references: users(id)